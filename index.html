<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Sunda Elegan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: '#064e3b', // Emerald Green utama
                        burgundy: '#881337', // Aksen Burgundy
                        cream: '#fefcf6'      // Warna latar lembut
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fefcf6; font-family: 'serif'; }
        .sunda-border { border: 2px solid #064e3b; padding: 20px; }
    </style>
</head>
<body class="text-emerald">

    <!-- Cover Depan -->
    <section id="cover" class="h-screen flex flex-col justify-center items-center p-6 text-center border-8 border-emerald m-4">
        <p class="uppercase tracking-[0.3em] text-sm text-burgundy">Walimatul 'Ursy</p>
        <h1 class="text-5xl font-bold my-6">Rivo & Vanisa</h1>
        <p class="mb-8">Menuju Ikatan Suci</p>
        <button onclick="bukaUndangan()" class="bg-emerald text-white px-8 py-3 rounded-full shadow-lg hover:bg-burgundy transition-all">
            Buka Undangan
        </button>
    </section>

    <!-- Konten (Awalnya Hidden) -->
    <main id="konten" class="hidden max-w-lg mx-auto p-6 space-y-12">
        
        <!-- Layer 2: Nama Wanita -->
        <section class="text-center sunda-border shadow-2xl bg-white">
            <h2 class="text-xs uppercase tracking-widest text-burgundy mb-2">Mempelai Wanita</h2>
            <div class="w-24 h-24 mx-auto bg-emerald/10 rounded-full flex items-center justify-center mb-4">
                <span class="text-emerald text-2xl">✨</span>
            </div>
            <h3 class="text-3xl font-bold">Vanisa Mutiara Sapaati</h3>
            <p class="text-sm mt-2 italic text-emerald/70">Putri dari Bapak & Ibu</p>
        </section>

        <!-- Tambahan Elemen Sunda -->
        <section class="text-center">
            <p class="text-emerald/80 italic font-serif">
                "Maha Suci Allah yang menciptakan makhluk-Nya berpasang-pasangan. Semoga pernikahan kami menjadi ibadah yang penuh berkah."
            </p>
        </section>

    </main>

    <script>
        function bukaUndangan() {
            document.getElementById('cover').classList.add('hidden');
            document.getElementById('konten').classList.remove('hidden');
        }
    </script>
</body>
</html>
